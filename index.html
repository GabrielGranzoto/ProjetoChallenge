<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Camera App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Arquivo de Estilos Externo -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-black text-white antialiased select-none overflow-hidden">
  
  <!-- Viewfinder (Container Principal Mobile First) -->
  <div class="relative w-full h-dvh max-w-md mx-auto overflow-hidden bg-black flex flex-col justify-between">

    <!-- ÁREA DA CÂMERA (VIEWFINDER) -->
    <div class="relative flex-1 w-full overflow-hidden bg-neutral-900 rounded-b-3xl">
      
      <!-- Video Stream -->
      <video id="camera-feed" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>

      <!-- Grid 3x3 (oculta por padrão) -->
      <div id="grid-overlay" class="absolute inset-0 pointer-events-none hidden">
        <div class="absolute left-1/3 top-0 bottom-0 w-px bg-white/30"></div>
        <div class="absolute left-2/3 top-0 bottom-0 w-px bg-white/30"></div>
        <div class="absolute top-1/3 left-0 right-0 h-px bg-white/30"></div>
        <div class="absolute top-2/3 left-0 right-0 h-px bg-white/30"></div>
      </div>

      <!-- Barra Superior de Ações -->
      <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-4 pt-4 pb-6 bg-gradient-to-b from-black/60 to-transparent z-10">
        <button id="btn-hdr" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md text-[11px] font-bold active:scale-95 transition flex items-center justify-center">HDR</button>
        
        <button id="btn-edit" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md active:scale-95 transition flex items-center justify-center">
          <i data-lucide="wand-2" class="w-5 h-5 text-white"></i>
        </button>
        
        <button id="btn-flash" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md active:scale-95 transition flex items-center justify-center">
          <i data-lucide="zap-off" class="w-5 h-5"></i>
        </button>
        
        <button id="btn-grid" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md active:scale-95 transition flex items-center justify-center">
          <i data-lucide="grid" class="w-5 h-5"></i>
        </button>
        
        <button id="btn-scan" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md active:scale-95 transition flex items-center justify-center">
          <i data-lucide="scan" class="w-5 h-5"></i>
        </button>
      </div>

    </div>

    <!-- ÁREA DE CONTROLES INFERIORES -->
    <div class="flex flex-col bg-black pt-3 pb-4">
      
      <!-- Controles de Disparo (Galeria, Obturador, Flip, etc) -->
      <div class="flex items-center justify-around px-4 my-2">
        
        <!-- Galeria -->
        <button id="btn-gallery" class="w-12 h-12 rounded-2xl overflow-hidden bg-neutral-800 border border-neutral-700 flex items-center justify-center active:scale-90 transition">
          <i data-lucide="image" class="w-6 h-6 text-neutral-400"></i>
        </button>

        <!-- Ícone da IA -->
        <button id="btn-ai" class="w-10 h-10 rounded-full bg-neutral-900 flex items-center justify-center active:scale-90 transition">
          <i data-lucide="sparkles" class="w-5 h-5 text-amber-400"></i>
        </button>

        <!-- Obturador (Shutter) -->
        <button id="btn-shutter" class="w-[72px] h-[72px] rounded-full border-4 border-white flex items-center justify-center active:scale-90 transition p-0.5 shrink-0">
          <span class="w-full h-full rounded-full bg-white ring-4 ring-amber-400"></span>
        </button>

        <!-- Zoom -->
        <button id="btn-zoom" class="w-10 h-10 rounded-full bg-neutral-900 text-amber-400 font-bold text-xs flex items-center justify-center active:scale-90 transition">
          1x
        </button>

        <!-- Inverter Câmera -->
        <button id="btn-flip" class="w-12 h-12 rounded-2xl bg-neutral-800 flex items-center justify-center active:scale-90 transition">
          <i data-lucide="switch-camera" class="w-6 h-6 text-white"></i>
        </button>
      </div>

      <!-- Barra de Modos de Câmera (Scroll Horizontal) -->
      <div class="flex items-center gap-2 px-3 mt-2">
        <button id="btn-settings" class="w-9 h-9 rounded-full bg-neutral-800 text-white flex items-center justify-center shrink-0 active:scale-90 transition">
          <i data-lucide="sliders" class="w-4 h-4"></i>
        </button>

        <div class="relative flex-1 overflow-x-auto modes-scroll py-1">
          <div class="relative flex items-center justify-center gap-6 px-4 text-sm font-medium whitespace-nowrap text-neutral-400">
            <button class="mode-tab hover:text-white" data-mode="Noite">Noite</button>
            <button class="mode-tab hover:text-white" data-mode="Retrato">Retrato</button>
            <button class="mode-tab active" data-mode="Foto">Foto</button>
            <button class="mode-tab hover:text-white" data-mode="Video">Vídeo</button>
            <button class="mode-tab hover:text-white" data-mode="Pro">Pro</button>
          </div>
        </div>

        <button id="btn-more" class="w-9 h-9 rounded-full bg-neutral-800 text-white flex items-center justify-center shrink-0 active:scale-90 transition">
          <i data-lucide="more-horizontal" class="w-4 h-4"></i>
        </button>
      </div>

    </div>

  </div>

  <!-- Inicializar Ícones Lucide -->
  <script>
    lucide.createIcons();
    document.getElementById('btn-gallery').addEventListener('click', () => {
      window.location.href = 'pages/gallery.html';
    });
  </script>
</body>
</html>
